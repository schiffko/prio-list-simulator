[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-charging-simulator"
version = "1.0.0"
description = "Multi-platform EV charging station simulator with Modbus TCP"
authors = [{name = "Your Name", email = "your.email@example.com"}]
requires-python = ">=3.8"
dependencies = [
    "PyQt5>=5.15.0",
    "pymodbus>=3.6.0",
]

[project.scripts]
ev-simulator = "charging_simulator.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["charging_simulator*"]
